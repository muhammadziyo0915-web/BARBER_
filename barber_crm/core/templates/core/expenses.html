{% extends 'core/base.html' %}{% block page_title %}Xarajatlar{% endblock %}{% block content %}<div class="two-col"><form method="post" class="card form">{% csrf_token %}<h3>＋ Xarajat</h3><label>Nomi<input name="title" required></label><div class="form-grid"><label>Summa (so‘m)<input name="amount" type="number" step="1000" required></label><label>Sana<input name="date" type="date" required></label></div><label>Kategoriya<input name="category" placeholder="Ijara, material..."></label><label>Izoh<textarea name="description"></textarea></label><button class="primary">Saqlash</button></form><section class="card table-card"><div class="table-wrap"><table><tr><th>Nomi</th><th>Summa</th><th>Kategoriya</th><th>Sana</th></tr>{% for x in items %}<tr><td>{{x.title}}</td><td>{{x.amount|floatformat:0}} so‘m</td><td>{{x.category}}</td><td>{{x.date}}</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
