{% extends 'core/base.html' %}{% block page_title %}Xizmatni tahrirlash{% endblock %}{% block content %}<form method="post" enctype="multipart/form-data" class="card form narrow">{% csrf_token %}<h2>✏️ {{service.name}}</h2><label>Nomi<input name="name" value="{{service.name}}" required></label><div class="form-grid"><label>Narxi (so‘m)<input name="price" type="number" value="{{service.price|floatformat:0}}" required></label><label>Davomiyligi (daqiqa)<input name="duration" type="number" value="{{service.duration}}" required></label></div><label>Tavsif<textarea name="description">{{service.description}}</textarea></label><label>Barberlar<select name="barbers" multiple>{% for b in barbers %}<option value="{{b.id}}" {% if b in service.barbers.all %}selected{% endif %}>{{b}}</option>{% endfor %}</select></label><label>Yangi rasmlar<input type="file" name="images" multiple accept="image/*"></label><label class="check"><input type="checkbox" name="is_active" {% if service.is_active %}checked{% endif %}> Faol xizmat</label><div class="image-row">{% for img in service.images.all %}<div class="img-item"><img src="{{img.image.url}}"><button type="submit" class="img-del" formaction="{% url 'service_image_delete' img.id %}" formmethod="post" formnovalidate onclick="return confirm('Bu rasmni o‘chirasizmi?')" title="Rasmni o‘chirish">🗑</button></div>{% empty %}<span class="muted">Rasmlar yo‘q.</span>{% endfor %}</div><button class="primary">Saqlash</button></form>{% endblock %}
